name: Node.js Microservices CI

permissions:
  contents: write

on:
  workflow_dispatch:

  push:
    branches: ["master"]

    paths-ignore:
      - 'README.md'
      - '.github/workflows/ci.yml'
      - 'LICENSE'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'k8s-**/**'


  pull_request:
    branches: ["master"]

    paths-ignore:
      - 'README.md'
      - '.github/workflows/ci.yml'
      - 'LICENSE'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'k8s-**/**'

env:
  NODE_VERSION: 18
  DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_USERNAME }}
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [gateway, mailer, permission, task, token, user]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

  build-and-push-images:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [gateway, mailer, permission, task, token, user]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_ORG }}/${{ matrix.service }}:latest
            ${{ env.DOCKERHUB_ORG }}/${{ matrix.service }}:${{ github.sha }}


  # =========================================================================
  # FINAL CD JOB (APPENDED)
  # =========================================================================
  update-gitops-manifests:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install Kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update All Microservice Image Tags
        run: |
          # Step inside your local manifest folder
          cd k8s-manifests
          
          # This loop updates the kustomization.yaml template with the exact commit SHA code
          for svc in gateway mailer permission task token user; do
            kustomize edit set image ${{ env.DOCKERHUB_ORG }}/$svc=${{ env.DOCKERHUB_ORG }}/$svc:${{ github.sha }}
          done

      - name: Commit and Push Manifest Changes
        run: |
          git config --global user.name "Kapil Gole"
          git config --global user.email "kapilprajapat0011@gmail.com"
          
          # Only stage and track your Kubernetes configuration folder
          git add k8s-manifests/
          
          # [skip ci] acts as a second firewall protection against workflow loops
          git commit -m "chore(deploy): bump images tag to ${{ github.sha }} [skip ci]" || exit 0
          git push origin master