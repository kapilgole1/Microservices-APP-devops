apiVersion: v1
kind: Secret

metadata:
  name: mongo-secret
  namespace: web-app-k8s

type: Opaque

stringData:

  #MONGO_USER: "u1"
  #MONGO_PASSWORD: "some"
  #MONGO_DSN: "mongodb://u1:some@db:27017/testdb"

  MONGO_INITDB_ROOT_USERNAME: ${{ secrets.Mongo_INITDB_ROOT_USERNAME }}
  MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
  MONGO_DSN: ${{ secrets.MONGO_DSN }}