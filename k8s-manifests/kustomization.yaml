apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gateway/
  - mailer/
  - permission/
  - task/
  - token/
  - user/

images:
  - name: <DOCKERHUB_ORG>/gateway
    newTag: latest
  - name: <DOCKERHUB_ORG>/mailer
    newTag: latest
  - name: <DOCKERHUB_ORG>/permission
    newTag: latest
  - name: <DOCKERHUB_ORG>/task
    newTag: latest
  - name: <DOCKERHUB_ORG>/token
    newTag: latest
  - name: <DOCKERHUB_ORG>/user
    newTag: latest