apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservice-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kapilgole1/Microservices-APP-devops.git
    targetRevision: master
    path: k8s-manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: web-app-k8s

  syncPolicy:
    automated:
      prune: true
      selfHeal: true