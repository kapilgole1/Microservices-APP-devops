apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: web-app-k8s
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: kapilgole1/gateway:latest
          #imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: API_GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: API_GATEWAY_PORT
            - name: TOKEN_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TOKEN_SERVICE_PORT
            - name: TOKEN_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TOKEN_SERVICE_HOST
            - name: USER_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_SERVICE_PORT
            - name: USER_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_SERVICE_HOST
            - name: TASK_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TASK_SERVICE_PORT
            - name: TASK_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TASK_SERVICE_HOST
            - name: PERMISSION_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PERMISSION_SERVICE_PORT
            - name: PERMISSION_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PERMISSION_SERVICE_HOST
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET